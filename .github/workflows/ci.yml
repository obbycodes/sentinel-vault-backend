name: CI Quality Checks

on:
  push:
    branches: [ "main", "master", "chore/pytest" ]
  pull_request:
    branches: [ "main", "master", "chore/pytest" ]

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --require-hashes pip==26.2 --hash=sha256:a6fb631024bd3cf6b957e844fa0e0e184fa95e0c0349479b1bfb95e0e0bb5131 --hash=sha256:7fd9d39b8bc737397b952f4bcfc70f1a9d0a6a2c222b40a33a5b060d00f722a4
        pip install --no-deps -e .
        pip install --require-hashes --no-deps -r requirements.txt

    - name: Execute Automated Security Tests
      env:
        secret_key: ${{ secrets.TEST_SECRET_KEY }}
      run: |
        pytest --maxfail=1 --disable-warnings

  quality-control:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --require-hashes pip==26.2 --hash=sha256:a6fb631024bd3cf6b957e844fa0e0e184fa95e0c0349479b1bfb95e0e0bb5131 --hash=sha256:7fd9d39b8bc737397b952f4bcfc70f1a9d0a6a2c222b40a33a5b060d00f722a4
        python -m pip install ruff bandit toml

    - name: Run Ruff Formatter (Black style)
      run: ruff format --check .

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Bandit Security Scanner
      run: python -m bandit -r . -c pyproject.toml
