name: CI Quality Checks

on:
  push:
    branches: [ "main", "master", "chore/pytest" ]
  pull_request:
    branches: [ "main", "master", "chore/pytest" ]

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        export PIP_REQUIRE_HASHES=true
        export PIP_ONLY_BINARY=:all:
        printf "pip==26.2 --hash=sha256:931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad\n" > pip-upgrade.txt
        python -m pip install -r pip-upgrade.txt
        rm pip-upgrade.txt
        pip install --no-deps -e .
        pip install --require-hashes --only-binary :all: --no-deps -r requirements.txt

    - name: Execute Automated Security Tests
      env:
        secret_key: ${{ secrets.TEST_SECRET_KEY }}
      run: |
        pytest --maxfail=1 --disable-warnings

  quality-control:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        export PIP_REQUIRE_HASHES=true
        export PIP_ONLY_BINARY=:all:
        printf "pip==26.2 --hash=sha256:931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad\n" > pip-upgrade.txt
        python -m pip install -r pip-upgrade.txt
        rm pip-upgrade.txt
        python -m pip install \
          ruff==0.16.8 --hash=sha256:1a41d83af9879a7b6e8bf5fe16b1da0b134049d2f5d3afac12defb0897cb84bd \
          bandit==1.9.4 --hash=sha256:f89ffa663767f5a0585ea075f01020207e966a9c0f2b9ef56a57c7963a3f6f8e \
          toml==0.10.2 --hash=sha256:806143ae5bfb6aab9460565debc048057be4930f5771f37e408ec9cf78a63503
        

    - name: Run Ruff Formatter (Black style)
      run: ruff format --check .

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Bandit Security Scanner
      run: python -m bandit -r . -c pyproject.toml
