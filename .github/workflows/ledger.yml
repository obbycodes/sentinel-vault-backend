name: Update Test Ledger on Merge

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  update-ledger:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.LEDGER_TOKEN }}

      - name: Mount Local Code and Discover Source Modules
        run: |
          unset PIP_REQUIRE_HASHES
          unset PIP_ONLY_BINARY
          python -m pip install --no-deps -e .
      
      - name: Install Secure Packages & Generate Report
        run: |
          export PIP_REQUIRE_HASHES=true
          export PIP_ONLY_BINARY=:all:
          python -m pip install --no-deps -r ci-tools.txt
          python -m pip install --no-deps -r requirements.txt

      - name: Run Tests & Update Test History Ledger
        run: |
          python -m pytest -p no:platformdirs --json-report --json-report-file=pytest-report.json
          
          python update_ledger.py
          
          echo "- PR #${{ github.event.pull_request.number }} merged at $(date)" >> TEST_HISTORY.md
          
      - name: Create Automated Ledger Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.LEDGER_TOKEN }}
          branch: automation/test-ledger-update
          commit-message: "chore(ci): update TEST_HISTORY.md with merge results"
          title: "chore(ci): sync test history ledger"
          body: "Automated test ledger tracking synchronization generated by post-merge CI hooks."
          base: main