name: Update Test Ledger on Merge

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  update-ledger:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.LEDGER_TOKEN }}

      - name: Mount Local Code and Discover Source Modules
        run: |
          unset PIP_REQUIRE_HASHES
          unset PIP_ONLY_BINARY
          python -m pip install --no-deps -e .
      
      - name: Install Secure Packages & Generate Report
        run: |
          export PIP_REQUIRE_HASHES=true
          export PIP_ONLY_BINARY=:all:
          python -m pip install --no-deps -r ci-tools.txt
          python -m pip install --no-deps -r requirements.txt

      - name: Run Tests & Update Test History Ledger
        run: |
          python -m pytest -p no:platformdirs --json-report --json-report-file=pytest-report.json
          
          python update_ledger.py
          
          echo "- PR #${{ github.event.pull_request.number }} merged at $(date)" >> TEST_HISTORY.md
          
      - name: Create Native Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.LEDGER_TOKEN }}
        run: |
          # 1. Setup local git identity
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # 2. Create a clean telemetry branch and stage the ledger file
          BRANCH_NAME="automation/test-ledger-update"
          git checkout -b "$BRANCH_NAME"
          git add TEST_HISTORY.md
          
          # 3. Commit the ledger update
          git commit -m "chore(ci): update TEST_HISTORY.md with merge results"
          
          # 4. Push to origin (force-update if the automation branch already exists)
          git push origin "$BRANCH_NAME" --force
          
          # 5. Check if an active PR already exists; if not, open a new one natively
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty' -r)

          
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(ci): sync test history ledger" \
              --body "Automated test ledger tracking synchronization generated by native post-merge CI hooks."
          else
            echo "Pull request #$PR_EXISTS already exists and has been successfully updated with new commits."
          fi
