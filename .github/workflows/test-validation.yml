name: Automated Testing & Audit Logs

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.11'
    
    - name: Mount Local Code & Python Modules
      run: |
        unset PIP_REQUIRE_HASHES
        unset PIP_ONLY_BINARY
        python -m pip install --no-deps -e .


    - name: Install dependencies
      run: |
        export PIP_REQUIRE_HASHES=true
        export PIP_ONLY_BINARY=:all:
        python -m pip install --no-deps -r ci-tools.txt
        python -m pip install --no-deps -r requirements.txt

    - name: Run automated tests
      run: |
        mkdir -p test-results
        pytest --junitxml=test-results/report.xml
      

    - name: Run Pytest & Generate MD Log
      run: |
        set +e
        pytest --md-report \
          --md-report-output pytest-report.md \
          --md-report-flavor gfm \
          --md-report-verbose 1 \
          --md-report-exclude-outcomes skipped,xfailed,xpassed
        PYTEST_EXIT_CODE=$?
        set -e

        if [ $PYTEST_EXIT_CODE -eq 0 ]; then
          # SUCCESS CASE
          HEADER="### ✅ Automated Test Results: PASSED\n\n> [!NOTE]\n> All backend authentication and security tests have successfully passed in this run.\n"
        else
          # FAILURE CASE
          HEADER="### ❌ Automated Test Results: FAILED\n\n> [!CAUTION]\n> Some or all tests have failed in this run. Review the details in the table below to debug the authentication pipeline.\n"
        fi

        sed -i "1i $HEADER" pytest-report.md

        SHORT_SHA=(echo "{{ github.sha }}" | cut -c1-7)
        echo -e "\n---\n*Report generated for commit: \`$SHORT_SHA\`*" >> pytest-report.md

        exit $PYTEST_EXIT_CODE


    - name: Post Report to PR
      if: always()
      uses: thollander/actions-comment-pull-request@24bffb9b472e351351199346618456de90bf4352
      with:
        file-path: pytest-report.md
        comment-tag: pytest_results
        github-token: ${{ secrets.GITHUB_TOKEN }}
        mode: upsert
        create-if-not-exists: true

    - name: Archive Test Log Artifacts
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-logs-${{ github.run_number }}
        path: test-results/
        retention-days: 30
