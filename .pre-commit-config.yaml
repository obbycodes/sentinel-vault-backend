# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll", "-ii", "-r", "app/"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: local
    hooks:
      - id: run-pytest-md
        name: Generate Local Test Log
        entry: pytest --md-report --md-report-output pytest-report.md
        language: system
        pass_filenames: false
        always_run: true

repos:
  - repo: local
    hooks:
      - id: update-local-ledger
        name: Update Living Test History Table
        entry: bash -c "pytest --json-report --json-report-file=pytest-report.json && python update_ledger.py && git add TEST_HISTORY.md"
        language: system
        pass_filenames: false
        always_run: true
